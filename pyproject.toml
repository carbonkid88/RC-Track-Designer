[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rc-track-designer"
version = "0.3.0"
description = "Maßstabsgetreuer 2D-Editor für RC-Rennstrecken"
readme = "README.md"
license = {file = "LICENSE.txt"}
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.gui-scripts]
rc-track-designer = "rc_track_designer.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rc_track_designer = ["locales/*.json", "assets/*.svg", "assets/*.png"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
